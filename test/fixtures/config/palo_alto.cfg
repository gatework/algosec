set deviceconfig system timezone Asia/Shanghai
set address uplink ip-netmask 203.0.113.9/24
set address clients ip-netmask 10.0.0.0/24
set address server ip-netmask 192.0.2.9/32
set address-group office static [ clients ]
set service web protocol tcp port 80,443,8080-8082
set service-group web-group members [ web service-https ]
set network interface ethernet ethernet1/1 layer3 ip 10.0.0.1/24
set network interface ethernet ethernet1/2 layer3 ip uplink
set network virtual-router default interface [ ethernet1/1 ethernet1/2 ]
set network virtual-router default routing-table ip static-route default destination 0.0.0.0/0
set network virtual-router default routing-table ip static-route default interface ethernet1/2
set network virtual-router default routing-table ip static-route default nexthop ip-address 203.0.113.1
set zone inside network layer3 ethernet1/1
set zone outside network layer3 ethernet1/2
set schedule "maintenance window" schedule-type non-recurring 2026/09/18@09:00-2026/09/18@18:00
set rulebase security rules allow-web from [ inside ]
set rulebase security rules allow-web to [ outside ]
set rulebase security rules allow-web source [ office 10.1.0.1-10.1.0.5 ]
set rulebase security rules allow-web destination server
set rulebase security rules allow-web application any
set rulebase security rules allow-web service web-group
set rulebase security rules allow-web action allow
set rulebase security rules allow-web schedule "maintenance window"
set rulebase nat rules outbound source-translation dynamic-ip-and-port interface-address interface ethernet1/2
set rulebase nat rules outbound source-translation dynamic-ip-and-port interface-address ip uplink
set rulebase nat rules outbound from inside
set rulebase nat rules outbound to outside
set rulebase nat rules outbound source clients
set rulebase nat rules outbound destination any
set rulebase nat rules outbound service any
set rulebase nat rules outbound disabled no
set rulebase nat rules publish from outside
set rulebase nat rules publish to outside
set rulebase nat rules publish source any
set rulebase nat rules publish destination 203.0.113.20
set rulebase nat rules publish service service-https
set rulebase nat rules publish destination-translation translated-address server
set rulebase nat rules publish destination-translation translated-port 8443
set rulebase nat rules publish disabled yes
