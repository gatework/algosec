config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.0.1 255.255.255.0
        set allowaccess ping https ssh
    next
    edit "port2"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set allowaccess ping https ssh
    next
end

config system zone
    edit "inside"
        set interface "port1"
    next
    edit "outside"
        set interface "port2"
    next
end

config router static
    edit 10
        set dst 0.0.0.0 0.0.0.0
        set gateway 198.51.100.254
        set device "port2"
    next
end

config firewall address
    edit "internal-web"
        set subnet 10.0.0.10 255.255.255.255
    next
    edit "public-web"
        set subnet 198.51.100.20 255.255.255.255
    next
end

config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end

config firewall policy
    edit 1
        set name "allow-web"
        set srcintf "inside"
        set dstintf "outside"
        set srcaddr "internal-web"
        set dstaddr "public-web"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
end
