interface eth0
 ip address 192.0.2.1 255.255.255.0
#
interface eth1
 ip address 198.51.100.1 255.255.255.0
#
firewall zone trust
 add interface eth0
#
firewall zone untrust
 add interface eth1
#
ip address-set clients type object
 address 0 192.0.2.10 mask 32
#
ip service-set web type object
 service 0 protocol tcp source-port 1024 to 65535 destination-port 443
#
nat address-group pool
 section 0 198.51.100.100 198.51.100.110
#
nat-policy
 rule name outbound
  source-zone trust
  destination-zone untrust
  source-address address-set clients
  action source-nat address-group pool
 rule name inbound
  source-zone untrust
  destination-zone trust
  destination-address 198.51.100.10 mask 255.255.255.255
  action destination-nat static port-to-port address 192.0.2.10 443 to 444
#
nat server vip zone untrust protocol tcp global 198.51.100.20 8443 inside 192.0.2.20 443
security-policy
 rule name allow-web
  source-zone trust
  destination-zone untrust
  source-address address-set clients
  destination-address 198.51.100.30 32
  service web
  action permit
#
