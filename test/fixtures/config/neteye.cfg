interface ethernet eth0
 ip address 192.0.2.1 255.255.255.0
#
zone trust
 zone trust based-layer3 eth0
#
object ipaddr clients 192.0.2.10,192.0.2.20-192.0.2.30
object service web tcp 1024-65535 443
object group clients-group type ipaddr clients
object group web-group type service web
policy access allow trust group clients-group untrust any protocol-group web-group permit enable 7
policy access allow sourceip address 192.0.2.40
policy access allow protocol udp 1-65535 53
policy snat outbound object clients iplist 198.51.100.100,198.51.100.101
policy snat outbound matching dip 203.0.113.1
#
policy dnat inbound 198.51.100.10 tcp 8443 192.0.2.10 443
#
policy mip static 192.0.2.20 198.51.100.20 enable
policy mip static matching protocol tcp port 80 90
#
