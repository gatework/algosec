zone "inside"
 vrouter "trust-vr"
exit
zone "outside"
exit
interface eth0
 zone "inside"
 ip address 192.0.2.1 255.255.255.0
exit
interface eth1
 zone "outside"
 ip address 198.51.100.1 255.255.255.0
exit
address "client"
 ip 192.0.2.10/32
exit
address "public"
 ip 198.51.100.10/32
exit
service "http"
 tcp dst-port 80 80
exit
ip vrouter "trust-vr"
 snatrule id 1 from "client" to "public" service "http" trans-to 198.51.100.100
 dnatrule id 2 from "any" to "public" service "http" trans-to "client" port 8080
exit
policy from "inside" to "outside"
 rule id 1
  src-addr "client"
  dst-addr "public"
  service "http"
  action permit
 exit
exit
